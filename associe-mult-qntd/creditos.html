<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créditos - Jogo de Associação</title>
  <link rel="stylesheet" href="src/css/style.css">
  <style>
    .credits-section {
      background-color: #fff;
      padding: 30px;
      border-radius: 6px;
      margin-bottom: 25px;
      border: 1px solid #e0e0e0;
    }
    
    .credits-section h2 {
      font-size: 1.3em;
      color: #333;
      margin-bottom: 15px;
      border-bottom: 2px solid #e8e8e8;
      padding-bottom: 10px;
    }
    
    .credits-section p {
      color: #666;
      line-height: 1.8;
      margin-bottom: 8px;
    }
    
    .credits-logo {
      text-align: center;
      margin: 30px 0;
    }
    
    .credits-logo img {
      max-height: 150px;
      max-width: 100%;
      height: auto;
    }
    
    .credits-container {
      max-width: 600px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <h1>Créditos</h1>
      <p class="subtitle">Equipe responsável pelo projeto</p>
    </header>
    
    <main class="main-content">
      <div class="credits-container">
        <div class="credits-section">
          <h2> Desenvolvedores</h2>
          <p>João Paulo de Medeiros</p>
          <p>Luana Araújo</p>
        </div>
        
        <div class="credits-logo">
          <img src="src/creditos.png" alt="Logo OBAMA">
        </div>
        
        
    </main>
    
    <footer class="footer">
      <a href="index.html" class="btn">Voltar ao Início</a>
      <p style="margin-top: 15px;">Desenvolvido por OBAMA - 2026</p>
    </footer>
  </div>
</body>
</html>
