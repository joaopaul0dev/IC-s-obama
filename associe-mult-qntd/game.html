<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Associação - Jogar</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <h1>Arraste as figuras para as multiplicações</h1>
    </header>
    
    <main class="game-content">
      <div class="container" id="game-container">
        <!-- Multiplicações (alvo) -->
        <div class="coluna">
          <h2>Multiplicações</h2>
          <div id="multiplicacoes">
            <div class="dropzone" data-valor="6">2 x 3</div>
            <div class="dropzone" data-valor="4">1 x 4</div>
            <div class="dropzone" data-valor="9">3 x 3</div>
            <div class="dropzone" data-valor="10">2 x 5</div>
            <div class="dropzone" data-valor="8">4 x 2</div>
          </div>
        </div>

        <!-- Figuras (arrastáveis) -->
        <div class="coluna">
          <h2>Figuras</h2>
          <div id="figuras">
            <div class="item" draggable="true" data-valor="4">⬛⬛⬛⬛</div>
            <div class="item" draggable="true" data-valor="6">⭐⭐⭐⭐⭐⭐</div>
            <div class="item" draggable="true" data-valor="8">🔷🔷🔷🔷🔷🔷🔷🔷</div>
            <div class="item" draggable="true" data-valor="9">🔺🔺🔺🔺🔺🔺🔺🔺🔺</div>
            <div class="item" draggable="true" data-valor="10">🟩🟩🟩🟩🟩🟩🟩🟩🟩🟩</div>
          </div>
        </div>
      </div>
      
      <!-- Modal de vitória -->
      <div class="modal" id="victory-modal">
        <div class="modal-content">
          <h2>Parabéns! Você venceu!</h2>
          <p> Todas as associações foram feitas corretamente!</p>
          <button class="btn btn-restart" onclick="location.reload()">Reiniciar Jogo</button>
        </div>
      </div>
    </main>
    
    <footer class="footer">
      <a href="index.html" class="btn">Voltar</a>
    </footer>
  </div>
  
  <script src="src/js/script.js"></script>
</body>
</html>
